<!doctype html>
<html><head><meta charset="utf-8"><title>Horizontal scroll test</title>
<style>
body { margin: 0; font: 16px -apple-system, sans-serif; }
.strip { width: 6000px; height: 60vh; background: repeating-linear-gradient(90deg, #4a90d9 0 100px, #e8eef7 100px 200px); position: relative; }
.mark { position: absolute; top: 10px; font-weight: bold; }
.box { width: 90vw; overflow-x: scroll; margin: 20px auto; border: 2px solid #333; }
.inner { width: 3000px; height: 120px; background: repeating-linear-gradient(90deg, #f5a623 0 50px, #fff4e0 50px 100px); }
#pos { position: fixed; bottom: 8px; left: 8px; background: #000c; color: #fff; padding: 4px 8px; border-radius: 4px; }
</style></head>
<body>
<div class="strip" id="strip"></div>
<p style="margin-left:16px">Inner scroll box (scrolls on its own):</p>
<div class="box" id="box"><div class="inner"></div></div>
<div id="pos"></div>
<script>
const s = document.getElementById("strip");
for (let x = 0; x < 6000; x += 500) { const m = document.createElement("div"); m.className = "mark"; m.style.left = x + 8 + "px"; m.textContent = x + "px"; s.appendChild(m); }
const box = document.getElementById("box"), pos = document.getElementById("pos");
const upd = () => pos.textContent = `page scrollX: ${Math.round(scrollX)}   box scrollLeft: ${Math.round(box.scrollLeft)}`;
addEventListener("scroll", upd); box.addEventListener("scroll", upd); upd();
</script></body></html>
